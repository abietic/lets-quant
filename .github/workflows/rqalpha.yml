name: RQAlpha compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: rqalpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and RQAlpha adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,rqalpha]'
      - name: Run core checks
        run: make lint check
      - name: Run independent-policy and RQAlpha lifecycle acceptance
        run: make rqalpha-test rqalpha-demo
