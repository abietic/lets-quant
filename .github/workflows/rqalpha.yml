name: RQAlpha compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/rqalpha.yml"
      - "Makefile"
      - "pyproject.toml"
      - "src/lets_quant/**"
      - "tests/test_rqalpha_adapter.py"
      - "config/**"
      - "examples/**"

permissions:
  contents: read

concurrency:
  group: rqalpha-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and RQAlpha adapter
        run: python -m pip install -e '.[dev,rqalpha]'
      - name: Run core checks
        run: make ci PYTHON=python
      - name: Run RQAlpha instrument, lifecycle, and action acceptance
        run: make rqalpha-test rqalpha-demo PYTHON=python
