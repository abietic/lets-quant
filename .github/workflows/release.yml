name: Release verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  package:
    name: Verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Build distributions and checksums
        run: |
          python -m pip install build==1.5.0
          python -m build
          sha256sum dist/* > dist/SHA256SUMS
      - name: Smoke test wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/release-install"
          "$RUNNER_TEMP/release-install/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-install/bin/python" -c 'from importlib.metadata import version; import lets_quant; assert lets_quant.__version__ == version("lets-quant")'
          "$RUNNER_TEMP/release-install/bin/lets-quant" --help
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lets-quant-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
