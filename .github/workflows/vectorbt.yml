name: VectorBT compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/vectorbt.yml"
      - "Makefile"
      - "pyproject.toml"
      - "src/lets_quant/**"
      - "tests/test_vectorbt_adapter.py"
      - "config/**"
      - "examples/**"

permissions:
  contents: read

concurrency:
  group: vectorbt-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and VectorBT adapter
        run: python -m pip install -e '.[dev,vectorbt]'
      - name: Verify VectorBT dependency boundary
        run: make vectorbt-dependency-check PYTHON=python
      - name: Run core checks
        run: make ci PYTHON=python
      - name: Run VectorBT instrument, opening-state, and action acceptance
        run: make vectorbt-test vectorbt-demo PYTHON=python
