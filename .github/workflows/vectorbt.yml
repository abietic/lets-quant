name: VectorBT compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: vectorbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and VectorBT adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,vectorbt]'
      - name: Run core checks
        run: make lint check
      - name: Run VectorBT instrument, opening-state, and action acceptance
        run: make vectorbt-test vectorbt-demo
