[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lets-quant"
version = "0.21.1"
description = "A local-first, research-only personal quantitative investing toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "lets-quant contributors" },
]
dependencies = []

[project.optional-dependencies]
akshare = ["akshare==1.18.79"]
dev = [
  "build==1.4.2; python_version < '3.10'",
  "build==1.5.0; python_version >= '3.10'",
  "ruff==0.16.5",
]
vectorbt = [
  "vectorbt==1.1.0; python_version >= '3.11' and python_version < '3.15'",
  "plotly>=4.12,<7; python_version >= '3.11' and python_version < '3.15'",
]
rqalpha = [
  "rqalpha==6.3.0; python_version >= '3.9' and python_version < '3.15'",
]

[project.scripts]
lets-quant = "lets_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
